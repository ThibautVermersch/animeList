<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AnimeBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/website/images/logo.svg" alt="logo" class="logo">
            <h1 class="site-name">AnimeBox</h1>
        </div>
        
        <div class="search-bar">
            <form role="search">
                <input type="search" placeholder="Rechercher" required>
                <button type="submit">🔎</button>
            </form>
        </div>
        
        <div class="profile">
            <img src="/website/images/profile.png" alt="profile">
        </div>
    </header>

    <main>
        <section class="anime-card-section">
            
            <article class="anime-card">
                <img src="/website/images/blackClover.jpg" alt="Black Clover" class="anime-card-img">
                <h3>Black Clover</h3>
            </article>
            
            <article class="anime-card">
                <img src="/website/images/naruto.jpg" alt="Naruto" class="anime-card-img">
                <h3>Naruto</h3>
            </article>
            
            <article class="anime-card">
                <img src="/website/images/classroomOfTheElite.jpg" alt="Classroom of the Elite" class="anime-card-img">
                <h3>Classroom of the Elite</h3>
            </article>
            
            <article class="anime-card">
                <img src="/website/images/attaqueDesTitans.jpg" alt="L'Attaque des Titans" class="anime-card-img">
                <h3>L'Attaque des Titans</h3>
            </article>
            
            <article class="anime-card">
                <img src="/website/images/chainsaw-man.jpg" alt="Chainsaw Man" class="anime-card-img">
                <h3>Chainsaw Man</h3>
            </article>
            
            <article class="anime-card">
                <img src="/website/images/demonSlayer.jpg" alt="Demon Slayer" class="anime-card-img">
                <h3>Demon Slayer</h3>
            </article>
            
            <article class="anime-card">
                <img src="/website/images/HXH.jpg" alt="Hunter x Hunter" class="anime-card-img">
                <h3>Hunter x Hunter</h3>
            </article>
            
            <article class="anime-card">
                <img src="/website/images/DeathNote.webp" alt="Death Note" class="anime-card-img">
                <h3>Death Note</h3>
            </article>
            
        </section>
    </main>
    <footer>
        <a href="#" class="arrow-button">
            <span class="arrow"></span>
        </a>
    </footer>
    
</body>
</html>

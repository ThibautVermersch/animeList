<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Black Clover</title>
        <link rel="stylesheet" href="/AnimeBox/resources/css/card-preview.css">
        <link rel="stylesheet" href="../css/style.css">

    </head>
    <body>
        <header>

                <div class="logo">
                    <a href="/AnimeBox/resources/html/index.html/html/index.html">
                        <img src="/AnimeBox/resources/images/logo.svg" alt="logo" class="logo-img">
                    </a>
                    <h1 class="site-name">AnimeBox</h1>
                </div>


            <div class="search-bar">
                <form role="search">
                    <input type="search" id="bar" placeholder="Rechercher" required>
                    <button type="submit" class="button-search" role="button">🔎</button>
                </form>
            </div>


            <div class="profile">
                <img src="/AnimeBox/resources/images/profile.png" alt="profile" class="profile-logo">
            </div>

        </header>


        <main>
            <div class="anime-container">

                <div class="poster-card">
                    <img src="/AnimeBox/resources/images/blackClover.jpg" alt="Affiche de Black Clover">
                </div>
                <div class="info-card">
                    <h1 class="anime-title">Black Clover</h1>
                    <div class="synopsis-section">
                        <h3>Synopsis :</h3>
                        <p>
                            Asta est un jeune garçon déterminé qui vit avec son ami d'enfance, Yuno, dans un orphelinat du royaume de Clover.
                            <a href="#" class="read-more">Voir plus</a>
                        </p>
                    </div>


                    <div class="categories-section">
                        <h3>Catégorie :</h3>
                        <div class="tags-grid">
                            <span class="badge">Action</span>
                            <span class="badge">Comédie</span>
                            <span class="badge">Fantasy</span>
                            <span class="badge">Aventure</span>
                            <span class="badge">Shonen</span>
                            <span class="badge">Fantastique</span>
                        </div>
                    </div>

                    <div class="meta-section">
                        <div class="meta-row">
                            <span class="meta-label">Studio d'animation :</span>
                            <span class="badge badge-wide">Studio Pierrot</span>
                        </div>

                        <div class="meta-row">
                            <span class="meta-label">Status :</span>
                            <span class="badge badge-wide">En cours</span>
                        </div>

                        <div class="meta-row">
                            <span class="meta-label">Note :</span>
                            <div class="badge rating-badge">
                                ★★★★☆
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    <footer>
        <a href="/AnimeBox/resources/html/index.html/html/index.html" class="arrow-anime-button">
            <span class="arrow-anime"></span>
        </a>
    </footer>
    </body>
</html>
